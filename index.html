<style>
@font-face { font-family: "Sangyo"; src: url("fonts/sangyo.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
/* Layout: one calm sheet. Mono label row, a floating command bar, a big headline, then a 4-up grid of tool tiles.
   A floating filter bar sits at the bottom. Add a tool = add one line to TOOLS. */
:root {
  --bg: #F3F2EE; --bg-tint-a: #EDEBF4; --bg-tint-b: #EEF3EA;
  --card: #FFFFFF; --ink: #1E2A2A; --muted: #7C8584; --line: #E6E4DE; --dark: #1F2B2B; --dark-ink: #F4F3EF;
  --accent: #C2643B; --live: #2F3B3B;
  --p-blue: #C9DDF0; --p-sand: #E9DFC8; --p-sage: #DDE6D6; --p-rose: #EBC6B8; --p-lilac: #CFC8EA; --p-night: #1F2B2B; --p-sky: #C8CEF2;
  --display: "Sangyo", "Arial Black", sans-serif;
  --body: "Manrope", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151918; --bg-tint-a: #1A1A24; --bg-tint-b: #161F18;
  --card: #1F2524; --ink: #EDEFEC; --muted: #8E9896; --line: #2C3433; --dark: #EDEFEC; --dark-ink: #151918;
  --accent: #E08A5F; --live: #EDEFEC;
  --p-blue: #2A3A4C; --p-sand: #3B3628; --p-sage: #2B3729; --p-rose: #46302A; --p-lilac: #332E4A; --p-night: #0E1312; --p-sky: #2D3256;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #151918; --bg-tint-a: #1A1A24; --bg-tint-b: #161F18;
  --card: #1F2524; --ink: #EDEFEC; --muted: #8E9896; --line: #2C3433; --dark: #EDEFEC; --dark-ink: #151918;
  --accent: #E08A5F; --live: #EDEFEC;
  --p-blue: #2A3A4C; --p-sand: #3B3628; --p-sage: #2B3729; --p-rose: #46302A; --p-lilac: #332E4A; --p-night: #0E1312; --p-sky: #2D3256;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { min-height: 100%; }
body { background: radial-gradient(1200px 700px at 0% 0%, var(--bg-tint-a), transparent 60%), radial-gradient(1000px 700px at 100% 40%, var(--bg-tint-b), transparent 60%), var(--bg); background-attachment: fixed; color: var(--ink); font: 500 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 140px; }
.mono { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* label row */
.toprow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-inline: 8px; }
.toprow .brand { display: flex; align-items: center; gap: 8px; }
.toprow .brand svg { width: 26px; height: 17px; }
.toprow .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.toprow .note { font: 700 12px var(--mono); color: var(--accent); letter-spacing: .04em; }
.toprow .pill { font: 700 11.5px var(--mono); letter-spacing: .06em; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; color: var(--ink); cursor: pointer; }

/* command bar */
.cmd { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 10; margin-top: 22px; display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 8px; box-shadow: 0 10px 30px -18px rgba(30, 42, 42, .35); }
.stack { display: flex; align-items: center; gap: 14px; background: var(--dark); color: var(--dark-ink); border-radius: 15px; padding: 12px 18px; font: 700 15px var(--body); white-space: nowrap; }
.stack small { font: 700 13px var(--mono); opacity: .8; }
.sister { display: flex; align-items: center; gap: 8px; white-space: nowrap; font: 700 15px var(--body); color: var(--ink); border: 1.5px solid var(--line); border-radius: 15px; padding: 11px 16px; transition: border-color .2s, background .2s; }
.sister:hover { border-color: var(--ink); background: var(--bg); }
.sister i { width: 7px; height: 7px; border-radius: 50%; background: #5DBB7A; box-shadow: 0 0 0 3px color-mix(in srgb, #5DBB7A 25%, transparent); }
.sister .short { display: none; }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding-inline: 10px; }
.search svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font: 500 16px var(--body); padding-block: 10px; }
.search input::placeholder { color: var(--muted); }
.kbd { font: 600 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; white-space: nowrap; }
.sep { width: 1px; height: 26px; background: var(--line); }
.vbtn { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: none; border: 0; color: var(--muted); cursor: pointer; }
.vbtn svg { width: 19px; height: 19px; }
.vbtn:hover { color: var(--ink); background: var(--bg); }
.vbtn[aria-pressed="true"] { background: var(--dark); color: var(--dark-ink); }
@media (max-width: 640px) { .kbd, .sep, #themeBtn { display: none; } .sister { padding: 11px 12px; } .sister .lbl { display: none; } .sister .short { display: inline; } .stack { padding: 11px 13px; gap: 8px; } .stack .lbl { display: none; } }

/* headline */
.head { padding: 52px 14px 30px; }
.head h1 { font: 400 clamp(42px, 6.6vw, 72px)/.95 var(--display); margin: 14px 0 0; letter-spacing: -.01em; text-wrap: balance; }
.head h1 em { font-style: normal; color: var(--accent); }

/* tiles */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 960px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
@media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
.tile { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 7px; box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 14px 28px -22px rgba(30, 42, 42, .45);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 55ms); }
.tile:hover { transform: translateY(-4px); box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 22px 34px -22px rgba(30, 42, 42, .55); }
@keyframes rise { from { opacity: .001; transform: translateY(14px) scale(.98); } }
.panel { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--tint); }
.panel img { position: absolute; inset: 9% 12%; width: 76%; height: 82%; object-fit: cover; border-radius: 9px; box-shadow: 0 10px 22px -10px rgba(0,0,0,.45); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.tile:hover .panel img { transform: translateY(-3px) scale(1.04); }
.panel .dot { position: absolute; left: 10px; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--live); opacity: .7; }
.panel .badge { position: absolute; right: 9px; bottom: 8px; font: 700 9.5px var(--mono); letter-spacing: .08em; background: var(--card); color: var(--ink); border-radius: 5px; padding: 3px 6px; }
.meta { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; padding: 11px 8px 6px; }
.meta b { font: 700 17px/1.25 var(--body); letter-spacing: -.01em; }
.meta .num { font: 600 10.5px var(--mono); color: var(--muted); align-self: center; }
.meta .cat { font: 600 11px var(--body); color: var(--muted); }
.meta .arrow { font-size: 12px; color: var(--muted); justify-self: end; transition: transform .2s, color .2s; }
.tile:hover .arrow { transform: translate(2px, -2px); color: var(--accent); }
.desc { display: none; }
.empty { padding: 40px 14px; color: var(--muted); }

/* featured: its own full-width tile above the grid. Preview on the left, what it is on the right. */
.feature { display: grid; grid-template-columns: 1.25fr 1fr; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 8px; margin-bottom: 26px;
  box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 18px 34px -24px rgba(30, 42, 42, .5); animation: rise .55s cubic-bezier(.2,.8,.2,1) both; transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
.feature:hover { transform: translateY(-3px); box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 26px 40px -24px rgba(30, 42, 42, .6); }
.feature .panel { aspect-ratio: 16 / 10; border-radius: 15px; }
.feature .panel img { inset: 8% 7% 10%; width: 86%; height: 82%; }
.feature:hover .panel img { transform: translateY(-3px) scale(1.03); }
.feature .flag { position: absolute; z-index: 2; left: 12px; top: 11px; font: 700 10px var(--mono); letter-spacing: .12em; background: var(--dark); color: var(--dark-ink); border-radius: 6px; padding: 4px 8px; }
.feature .side { display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 22px 26px 22px 22px; min-width: 0; }
.feature h2 { font: 400 clamp(34px, 4.4vw, 52px)/.95 var(--display); margin: 0; }
.feature .cat { font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.feature p { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.55; max-width: 42ch; }
.feature .points { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.feature .points li { display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; }
.feature .points li::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); flex: none; transform: translateY(-2px); }
.feature .cta { align-self: flex-start; margin-top: 6px; font: 700 15px var(--body); background: var(--dark); color: var(--dark-ink); border-radius: 14px; padding: 13px 20px; transition: transform .2s; }
.feature:hover .cta { transform: translateY(-2px); }
.grid-label { display: flex; align-items: baseline; gap: 12px; padding: 0 6px 14px; }
@media (max-width: 760px) { .feature { grid-template-columns: 1fr; } .feature .side { padding: 14px 12px 12px; } }

/* list view */
.grid.list { grid-template-columns: 1fr; gap: 10px; }
.grid.list .tile { flex-direction: row; align-items: center; gap: 16px; }
.grid.list .panel { width: 168px; flex: none; }
.grid.list .meta { flex: 1; min-width: 0; padding: 4px 10px 4px 0; }
.grid.list .desc { display: block; grid-column: 1 / -1; color: var(--muted); font-size: 14px; margin-top: 4px; }
@media (max-width: 560px) { .grid.list .panel { width: 110px; } .grid.list .desc { display: none; } }

/* floating filter bar */
.filters { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(1048px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 7px; box-shadow: 0 16px 34px -20px rgba(30, 42, 42, .45); overflow-x: auto; scrollbar-width: none; }
.filters button { flex: 1 0 auto; font: 600 14px var(--body); color: var(--muted); background: none; border: 0; border-radius: 15px; padding: 11px 18px; cursor: pointer; white-space: nowrap; }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--dark); color: var(--dark-ink); }
.filters .tally { flex: none; font: 700 12px var(--mono); color: var(--muted); padding-inline: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.filters .tally i { width: 6px; height: 6px; border-radius: 50%; background: #5DBB7A; }
.filters .tally b { color: var(--ink); }

.mock { text-align: center; padding-top: 34px; }
@media (prefers-reduced-motion: reduce) { .tile { animation: none; } .tile, .panel img, .arrow { transition: none; } }
</style>
</head>
<body>

<main class="wrap">
  <div class="toprow">
    <span class="brand"><svg viewBox="0 0 11 7" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FDCB58" d="M2 0h8v1h-8zM1 1h10v5h-10zM2 6h8v1h-8z"/><path fill="#F4900C" d="M0 3h1v2h-1zM5 4h3v1h-3z"/><path fill="#E6E7E8" d="M3 3h1v2h-1zM8 3h1v2h-1z"/><path fill="#31373D" d="M4 3h1v2h-1zM9 3h1v2h-1z"/></svg><span class="mono" id="range">Chonkit / 001–007</span></span>
    <span class="right"><button class="pill" id="themeBtn" type="button" aria-label="Switch theme">LIGHT / DARK</button></span>
  </div>

  <div class="cmd" role="search">
    <span class="stack"><span class="lbl">Chonkit</span><small id="stackN">7</small></span>
    <a class="sister" href="https://dailychonk.xyz" target="_blank" rel="noopener" aria-label="Daily Chonk, opens dailychonk.xyz"><i></i><span class="lbl">Daily Chonk</span><span class="short">Daily</span> ↗</a>
    <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Find your next Chonk tool…" autocomplete="off"></label>
    <span class="kbd" id="kbd">⌘ K</span>
    <span class="sep"></span>
    <button class="vbtn" id="listBtn" type="button" aria-pressed="false" aria-label="List view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="15" width="18" height="5" rx="1.5"/></svg></button>
    <button class="vbtn" id="gridBtn" type="button" aria-pressed="true" aria-label="Grid view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></button>
  </div>

  <section class="head">
    <span class="mono" id="eyebrow">Made from Chonks on Base / 007</span>
    <h1 id="headline">7 tools. One <em>Chonk</em> studio.</h1>
  </section>

  <a class="feature" id="feature" hidden></a>
  <div class="grid-label"><span class="mono" id="allLabel">All tools</span></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing matches that. Try “gif”, “3D” or “paint”.</p>
</main>

<nav class="filters" id="filters" aria-label="Filter tools"></nav>

<script>
// The big tile at the top of the grid. Set it to any tool's id below (mosaic, studio, ascii, sketch, gallery, wars, gifs).
const FEATURED = "wars";

// Every page on the site. Add a page = add one line here.
const SITE = "";
const GROUPS = [{ id: "all", name: "Everything" }, { id: "make", name: "Make" }, { id: "play", name: "Play" }, { id: "watch", name: "Download" }];
const TOOLS = [
  { id: "mosaic", group: "make", cat: "Mosaic", name: "Mosaic maker", href: "mosaic.html", tint: "--p-blue", desc: "Rebuild any picture out of Chonks.", keys: "mosaic image photo picture pfp", live: true },
  { id: "studio", group: "make", cat: "Pixel art", name: "Studio", href: "studio.html", tint: "--p-sand", desc: "Paint pixel art where every pixel is a Chonk.", keys: "paint draw pixel canvas" },
  { id: "ascii", group: "make", cat: "Text art", name: "ASCII", href: "ascii.html", tint: "--p-night", desc: "Text art from any Chonk, spinning in 3D. Export a GIF.", keys: "text ascii gif 3d glb hologram statue" },
  { id: "sketch", group: "make", cat: "Pencil", name: "Sketch", href: "sketchbook.html", tint: "--p-rose", desc: "Any Chonk redrawn in coloured pencil, with a stop-motion spin.", keys: "pencil drawing sketchbook gif spin" },
  { id: "gallery", group: "play", cat: "3D", name: "Gallery", href: "gallery.html", tint: "--p-sage", desc: "A 3D gallery for your mosaics. Walk it in first person.", keys: "3d museum walk statue hologram" },
  { id: "wars", group: "play", cat: "Game", name: "Chonk Wars", href: "wars/", tint: "--p-lilac", desc: "200 Chonks battle over the live Bitcoin price. Every trade is a blow, and you can jump in and play as any Chonk.", keys: "game battle bitcoin btc cavalry war", isNew: true, live: true, cta: "Play now",
    points: ["Live BTC price drives every hit", "Airstrikes and a 10-a-side cavalry charge", "Load any wallet as your army"] },
  { id: "gifs", group: "watch", cat: "Animation", name: "GIFs", href: "gifs/", tint: "--p-sky", desc: "Blender animations. Download the MP4 or a GIF to post.", keys: "gif mp4 video blender gm animation", isNew: true },
];
const $ = (id) => document.getElementById(id);
const link = (t) => /^https?:/.test(t.href) ? t.href : SITE + t.href;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pad = (n, w = 2) => String(n).padStart(w, "0");
const N = TOOLS.length;
$("stackN").textContent = N;
$("range").textContent = `Chonkit / 001–${pad(N, 3)}`;
$("eyebrow").textContent = `Made from Chonks on Base / ${pad(N, 3)}`;
$("headline").innerHTML = `${N} tools. One <em>Chonk</em> studio.`;
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $("kbd").textContent = "Ctrl K";

let group = "all";
$("filters").innerHTML = GROUPS.map((g) => `<button type="button" data-g="${g.id}" aria-pressed="${g.id === "all"}">${g.name}</button>`).join("") + `<span class="tally"><i></i><span id="tally"></span></span>`;
$("filters").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; group = b.dataset.g; $("filters").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); render(); });
$("q").addEventListener("input", render);

function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = TOOLS.map((t, i) => ({ ...t, n: i + 1 })).filter((t) => (group === "all" || t.group === group) && (!q || (t.name + " " + t.cat + " " + t.desc + " " + t.keys).toLowerCase().includes(q)));
  // the featured tool gets its own full-width tile; the rest go in the grid
  // the big tile only shows on the full "Everything" view; when filtering or searching, the featured tool is a normal tile
  const showcase = group === "all" && !q;
  const ft = showcase ? list.find((t) => t.id === FEATURED) : null, rest = ft ? list.filter((t) => t !== ft) : list, fe = $("feature");
  fe.hidden = !ft;
  if (ft) {
    fe.href = link(ft); fe.style.setProperty("--tint", `var(${ft.tint})`);
    fe.innerHTML = `<div class="panel"><span class="flag">FEATURED</span><img src="img/hub/${ft.id === "wars" ? "wars-wide" : ft.id}.webp" alt="">${ft.isNew ? '<span class="badge">NEW</span>' : ""}</div>
      <div class="side"><span class="cat">${esc(ft.cat)} · ${pad(ft.n)}</span><h2>${esc(ft.name)}</h2><p>${esc(ft.desc)}</p>
      ${ft.points ? `<ul class="points">${ft.points.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}<span class="cta">${esc(ft.cta || "Open")} ↗</span></div>`;
  }
  $("allLabel").textContent = ft ? "More tools" : group === "all" ? "All tools" : GROUPS.find((g) => g.id === group).name;
  $("allLabel").parentElement.hidden = !rest.length;
  $("grid").innerHTML = rest.map((t, k) => `<a class="tile" style="--i:${k + 1};--tint:var(${t.tint})" href="${link(t)}"${/^https?:/.test(t.href) ? ' target="_blank" rel="noopener"' : ""}>
      <div class="panel">${t.live ? '<span class="dot"></span>' : ""}<img src="img/hub/${t.id}.webp" alt="" ${k > 7 ? 'loading="lazy"' : ""}>${t.isNew ? '<span class="badge">NEW</span>' : ""}</div>
      <div class="meta"><b>${esc(t.name)}</b><span class="num">${pad(t.n)}</span><span class="cat">${esc(t.cat)}</span><span class="arrow">↗</span><span class="desc">${esc(t.desc)}</span></div></a>`).join("");
  $("empty").hidden = list.length > 0;
  $("tally").innerHTML = `<b>${list.length}</b> / ${N}`;
}
render();

// grid / list view
const view = (v) => { $("grid").classList.toggle("list", v === "list"); $("gridBtn").setAttribute("aria-pressed", String(v === "grid")); $("listBtn").setAttribute("aria-pressed", String(v === "list")); try { localStorage.setItem("hubView", v); } catch {} };
$("gridBtn").onclick = () => view("grid"); $("listBtn").onclick = () => view("list");
try { if (localStorage.getItem("hubView") === "list") view("list"); } catch {}

// ⌘K / Ctrl K / "/" jump to search
document.addEventListener("keydown", (e) => {
  if ((e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey)) || (e.key === "/" && document.activeElement.tagName !== "INPUT")) { e.preventDefault(); $("q").focus(); $("q").select(); }
  if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; render(); $("q").blur(); }
});

$("themeBtn").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("chonk-theme", r.dataset.theme); } catch {} };
</script>
</body>
</html>
