.logo .logo-mark.hat{display:none;width:30px;height:33px}

</script>
<style>
/* Chonkit look: same palette, fonts and menu as the mosaic maker, gallery and studio */
:root{
  --paper:#FAFBFF; --surface:#FFFFFF; --ink:#0E1230; --muted:#5B6185; --line:#E3E6F2; --soft:#F1F3FB; --quiet-hover:#E4E8F7;
  --blue:#0052FF; --yellow:#FFC93C;
  --display:"Sangyo","Arial Black",sans-serif; --body:"Manrope",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* names the tool below uses */
  --bg:var(--paper); --panel:var(--surface); --fg:var(--ink); --accent:var(--blue); --accent-ink:#ffffff; --stage:#14111c;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1024; --surface:#161A33; --ink:#EEF0FF; --muted:#9BA2C8; --line:#262B4D; --soft:#1E2340; --quiet-hover:#262C50; --blue:#3D7BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1024; --surface:#161A33; --ink:#EEF0FF; --muted:#9BA2C8; --line:#262B4D; --soft:#1E2340; --quiet-hover:#262C50; --blue:#3D7BFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
a{color:var(--blue)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,3vw,32px)}
.logo{display:flex;align-items:center;gap:10px;font:800 22px var(--display);color:var(--ink);text-decoration:none}
.logo .sq{width:22px;height:22px;border-radius:6px;background:var(--yellow);box-shadow:inset -4px -4px 0 #E8A91F}
.logo small{font:500 13px var(--body);color:var(--muted)}
@media (max-width:440px){.logo .logo-text{display:none}}
.site-nav{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.site-nav a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font:700 13.5px var(--body);color:var(--muted);text-decoration:none;white-space:nowrap}
.site-nav a:hover{color:var(--ink)}
.site-nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.site-nav .short{display:none}
.site-nav #galBadge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--yellow);color:#0E1230;font:800 10.5px/18px var(--body);text-align:center}
@media (max-width:640px){.site-nav .long{display:none}.site-nav .short{display:inline}.site-nav a{padding:6px 9px;font-size:12.5px}}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 clamp(16px,3vw,32px) 32px}
.intro h1{font:800 clamp(26px,4.4vw,40px)/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 6px}
.intro h1 span{color:var(--blue)}
.intro p{margin:0;color:var(--muted);max-width:62ch}
.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.stage{background:var(--stage);transition:background .2s;border:1px solid var(--line);border-radius:22px;position:relative;overflow:hidden;min-height:320px;display:grid;place-items:center;cursor:grab;touch-action:none}
.stage.drag{outline:2px dashed var(--accent);outline-offset:-8px}
.stage:active{cursor:grabbing}
#out{margin:0;padding:14px;font-family:var(--mono);line-height:1;white-space:pre;color:inherit;user-select:text;letter-spacing:0}
.badge{position:absolute;left:14px;bottom:10px;color:#9a93ad;font:12px var(--body);pointer-events:none}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px;font-size:14px}
.rail h2{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 0}
.inrow{display:flex;gap:6px;margin:0}
.inrow input{flex:1;min-width:0;font:inherit;padding:9px 11px;border-radius:11px;border:1.5px solid transparent;background:var(--soft);color:var(--fg)}
.inrow input:focus{border-color:var(--blue);background:var(--surface);outline:none}
.btn.sm{width:auto;padding:9px 14px}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tags button{font:700 12px var(--body);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.tags button:hover,.tags button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.tags:empty{display:none}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500}
label.f .row{display:flex;justify-content:space-between;color:var(--muted)}
label.f .row b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text]{width:100%;font:inherit;padding:9px 11px;border-radius:11px;border:1.5px solid transparent;background:var(--soft);color:var(--fg)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;user-select:none}
.chip input{accent-color:var(--accent);margin:0}
.btn{font:700 14px var(--body);border:0;border-radius:12px;padding:11px 12px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:var(--soft);color:var(--fg);border:1.5px solid transparent;font-weight:700}
.btn.ghost:hover:not(:disabled){background:var(--quiet-hover);filter:none}
.btn:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.sw input{width:26px;height:26px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pre{font:700 11.5px var(--body);padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--b);color:var(--i);cursor:pointer}
.gifout{display:grid;gap:6px}.gifout img{border-radius:10px;border:1px solid var(--line);width:100%}
.btn:disabled{opacity:.6;cursor:progress}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
.hint a{color:var(--accent)}
.status{font-size:13px;min-height:1.2em;color:var(--muted)}
.status.err{color:#d23a52}
.left{display:grid;gap:18px;min-width:0}
.look{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;font-size:14px}
.look .col{display:grid;gap:12px;align-content:start;min-width:0}
.look-foot{grid-column:1/-1;display:flex;justify-content:flex-end}
.look-foot .btn{width:auto;padding:9px 16px}
@media (max-width:760px){.look-foot .btn{width:100%}}
.look h2{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 0}
@media (max-width:1060px){.look{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .main{display:flex;flex-direction:column;min-width:0}
  .stage,.rail,.look{width:100%;min-width:0}
  .left{display:contents}
  .stage{order:1}.rail{order:2}.look{order:3;grid-template-columns:minmax(0,1fr)}
}
footer.foot{max-width:1240px;margin:0 auto;padding:4px clamp(16px,3vw,32px) 28px;color:var(--muted);font-size:13px}
/* iPhone: 16px text boxes so Safari doesn't zoom in when you tap one */
@media (pointer:coarse){input[type=text],input[type=number],select{font-size:16px!important}}
button,a,label,input,select{touch-action:manipulation}
/* Chonks mode: a 3D view made of real Chonks instead of text */
.chonk-only{display:none}
body.chonk-mode .chonk-only{display:block}
body.chonk-mode .text-only{display:none!important}
.stage canvas.r3{display:block}
.stage canvas.r3[hidden]{display:none}
/* GIFs page: a grid of looping videos, each with an MP4 download and a GIF maker */
.intro p{max-width:66ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.card{background:var(--panel);border:2px solid var(--edge,var(--line));border-radius:22px;box-shadow:6px 6px 0 var(--pop,transparent);overflow:hidden;display:grid}
.card video{display:block;width:100%;height:auto;background:#000;aspect-ratio:var(--ar,1/1)}
.card .body{padding:16px 18px 18px;display:grid;gap:12px}
.card h2{margin:0;font:400 22px/1.1 var(--display)}
.card .meta{margin:-6px 0 0;color:var(--muted);font-size:13px}
.card .btn{width:100%;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .meta.sizes{margin:-4px 0 0;font-size:12.5px}
footer.foot{margin-top:8px}
</style>

</head>
<body>
<header class="top">
  <a class="logo" href="../"><svg class="logo-mark plain sm" viewBox="0 0 11 7" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FDCB58" d="M2 0h8v1h-8zM1 1h10v5h-10zM2 6h8v1h-8z"/><path fill="#F4900C" d="M0 3h1v2h-1zM5 4h3v1h-3z"/><path fill="#E6E7E8" d="M3 3h1v2h-1zM8 3h1v2h-1z"/><path fill="#31373D" d="M4 3h1v2h-1zM9 3h1v2h-1z"/></svg><svg class="logo-mark hat sm" viewBox="0 0 11 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#7B3FE4" d="M6 0h1v1h-1zM5 1h2v1h-2zM4 2h4v1h-4zM3 3h1v1h-1zM7 3h1v1h-1zM0 4h11v1h-11z"/><path fill="#FF8A1F" d="M4 3h3v1h-3z"/><path fill="#FDCB58" d="M2 5h8v1h-8zM1 6h10v5h-10zM2 11h8v1h-8z"/><path fill="#F4900C" d="M0 8h1v2h-1zM5 9h3v1h-3z"/><path fill="#E6E7E8" d="M3 8h1v2h-1zM8 8h1v2h-1z"/><path fill="#31373D" d="M4 8h1v2h-1zM9 8h1v2h-1z"/></svg><span class="logo-text">Chonk GIFs <small>· animations made in Blender</small></span></a>

<div class="wrap">
  <div class="intro">
    <h1>Chonk <span>GIFs</span></h1>
    <p>Chonk animations made in Blender. Download the original MP4 at full quality, or a GIF sized to post (under 15 MB).</p>
  </div>
  <div class="grid" id="grid"><p class="hint">Loading…</p></div>

</div>
<footer class="foot">Made by <a href="https://x.com/jpegsonbase" target="_blank" rel="noopener">@jpegsonbase</a> · Chonks are CC0 · <a href="../">chonkit.xyz</a></footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const mb = (b) => b >= 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.round(b / 1e3) + " KB";

  // Videos only play while they're on screen
  const io = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => { const v = e.target; if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); }), { threshold: 0.25 }) : null;

  /* ---------- a card per video ---------- */
  function card(item) {
    const el = document.createElement("article");
    el.className = "card";
    el.style.setProperty("--ar", `${item.width || 1} / ${item.height || 1}`);
    const name = item.title;
    const base = slug(item.title) + (item.chonk ? "-chonk-" + item.chonk : "");
    const secs = item.frames && item.fps ? (item.frames / item.fps) : null;
    el.innerHTML = `
      <video muted loop playsinline preload="none" ${item.poster ? `poster="${esc(item.poster)}"` : ""} src="${esc(item.file)}" aria-label="${esc(name)}"></video>
      <div class="body">
        <h2>${esc(item.title)}</h2>
        <p class="meta">${item.width ? `${item.width}×${item.height}` : ""}${secs ? ` · ${secs.toFixed(secs % 1 ? 1 : 0)} s` : ""}${item.fps ? ` · ${item.fps} fps` : ""}</p>
        <div class="actions">
          <a class="btn" href="${esc(item.file)}" download="${esc(base)}.mp4">Download MP4</a>
          ${item.gif ? `<a class="btn ghost" href="${esc(item.gif)}" download="${esc(base)}.gif">Download GIF</a>` : ""}
        </div>
        <p class="meta sizes">${item.mp4Bytes ? `MP4 ${mb(item.mp4Bytes)}, full quality` : ""}${item.gifBytes ? ` · GIF ${mb(item.gifBytes)}` : ""}</p>
      </div>`;
    const vid = el.querySelector("video");
    if (io) io.observe(vid); else vid.autoplay = true;
    return el;
  }

  fetch("videos.json", { cache: "no-cache" }).then((r) => r.json()).then((list) => {
    const grid = $("grid"); grid.textContent = "";
    if (!list.length) { grid.innerHTML = '<p class="hint">No animations yet.</p>'; return; }
    for (const item of list) grid.append(card(item));
  }).catch(() => { $("grid").innerHTML = '<p class="hint">Couldn’t load the animations. Refresh to try again.</p>'; });

})();
</script>
